<style>
/* Layout: a calm personal letter from the hosts. Warm plaster page, classical italic headings,
   photos in thin white mounts, handwriting only for the greeting, small notes and the signature. */
:root{
  --paper:#f6f1e8; --paper-2:#fffcf6; --rule:#e3d9c8; --ink:#27231f; --ink-soft:#6e655b;
  --accent:#9a5b2e; --door:#1f4d3a; --note:#fbf3df; --note-line:#e6d2a3; --photo:#ffffff; --shadow:rgba(60,40,20,.12);
  --map-bg:#f3ede2; --map-water:#cddce2; --map-park:#e0e6cf; --map-square:#ebe2d1; --map-foot:#e0d6c4; --map-minor:#d2c6b0; --map-major:#bba98a;
  --k-sight:#9a5b2e; --k-eat:#1f4d3a; --k-ice:#b0476e; --k-super:#4f6274; --k-drink:#8a6d1f; --k-uniq:#6a4c93; --k-bf:#2e7d8c;
  --f-hand:"Caveat","Bradley Hand",cursive;
  --f-display:"Cormorant Garamond","Garamond",Georgia,serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1b1a18; --paper-2:#24221f; --rule:#3a352e; --ink:#ede6da; --ink-soft:#b3a999;
  --accent:#e0a575; --door:#7cc4a0; --note:#2e2a20; --note-line:#5c4e2c; --photo:#2f2c27; --shadow:rgba(0,0,0,.4);
  --map-bg:#211f1c; --map-water:#22323a; --map-park:#25291f; --map-square:#2a2722; --map-foot:#2f2b25; --map-minor:#3d372e; --map-major:#5a5040;
  --k-sight:#c0773f; --k-eat:#2f7a5a; --k-ice:#c05a82; --k-super:#5f7488; --k-drink:#a6852a; --k-uniq:#8a6bb8; --k-bf:#4aa3b3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b1a18; --paper-2:#24221f; --rule:#3a352e; --ink:#ede6da; --ink-soft:#b3a999;
  --accent:#e0a575; --door:#7cc4a0; --note:#2e2a20; --note-line:#5c4e2c; --photo:#2f2c27; --shadow:rgba(0,0,0,.4);
  --map-bg:#211f1c; --map-water:#22323a; --map-park:#25291f; --map-square:#2a2722; --map-foot:#2f2b25; --map-minor:#3d372e; --map-major:#5a5040;
  --k-sight:#c0773f; --k-eat:#2f7a5a; --k-ice:#c05a82; --k-super:#5f7488; --k-drink:#a6852a; --k-uniq:#8a6bb8; --k-bf:#4aa3b3; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;color:var(--ink);font:17px/1.65 var(--f-body);background:var(--paper)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
.page{max-width:620px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.langs{display:flex;gap:14px;flex-wrap:wrap;padding-block:18px 0}
.langs button{font:600 .8rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);background:none;border:0;border-bottom:1.5px solid transparent;padding:6px 0;min-height:36px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.hero{padding-block:26px 8px;display:grid;gap:8px}
.hero .hi{font:italic 500 clamp(3rem,10vw,4.4rem)/1 var(--f-display);color:var(--ink)}
.hero .sub{font:italic 500 clamp(1.9rem,8vw,2.5rem)/1.1 var(--f-display);color:var(--ink)}
.hero h1{font:600 .78rem/1.5 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.hero .addr{font-size:.95rem;color:var(--ink-soft)}
.snaps{display:grid;gap:10px;margin:22px 0 4px}
.pol{margin:0;background:var(--photo);padding:6px 6px 0;box-shadow:0 10px 24px -14px var(--shadow),0 0 0 1px var(--rule)}
.pol img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--rule)}
.pol figcaption{font:italic 500 1.05rem/1.2 var(--f-display);color:var(--ink-soft);padding:8px 4px 10px;text-align:center}
.note{font:italic 400 1.02rem/1.55 var(--f-body);color:var(--ink);border-left:2px solid var(--rule);padding-left:14px}
.snaps .note{grid-column:1/-1;margin-top:8px}

.quick{display:flex;flex-wrap:wrap;gap:10px;padding-block:18px 6px}
.quick a{font:600 .95rem var(--f-body);text-decoration:none;padding:11px 18px;border-radius:999px;border:1.5px solid var(--door);color:var(--door)}
.quick a.red{background:var(--door);color:var(--paper-2)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0 8px}
.tile{display:grid;gap:2px;align-content:start;text-decoration:none;color:var(--ink);background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:14px 14px 16px;min-height:92px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .tt{font:italic 600 1.35rem/1.1 var(--f-display)}
.tile .th{font-size:.85rem;line-height:1.35;color:var(--ink-soft)}
.tile.key{background:var(--note);border-color:var(--note-line)}
.tile.wide{grid-column:1/-1}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}.tile.wide{grid-column:auto}}
#view[hidden],#home[hidden]{display:none}
#view section{display:none;padding-top:8px}
#view section.on{display:block}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font:600 .82rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none;min-height:40px}
.back:hover{color:var(--accent)}
.side{display:none}
.pn{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);margin-top:40px;padding:16px 0 50px}
.pn a{text-decoration:none;color:var(--ink-soft);font-size:.9rem;display:grid;gap:2px;max-width:48%}
.pn a b{font:italic 600 1.25rem/1.1 var(--f-display);color:var(--ink)}
.pn a.nx{text-align:right;margin-left:auto}
.pn a:hover b{color:var(--accent)}
@media (min-width:980px){
  .wrapv{max-width:980px;margin:0 auto;display:grid;grid-template-columns:220px 1fr;gap:48px;padding:0 24px}
  .wrapv>.page{padding:0;max-width:640px;margin:0}
  .side{display:grid;align-content:start;gap:2px;position:sticky;top:20px;padding-top:30px;max-height:100vh}
  .side a{text-decoration:none;color:var(--ink-soft);padding:7px 12px;border-radius:8px;font-size:.95rem}
  .side a:hover{color:var(--ink);background:var(--paper-2)}
  .side a.on{color:var(--ink);background:var(--paper-2);box-shadow:inset 3px 0 0 var(--accent)}
  .side .home-l{font:italic 600 1.3rem var(--f-display);color:var(--ink);margin-bottom:8px}
  .back{display:none}
}
.uq{display:grid;gap:12px;margin-top:8px}
.uq article{background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.uq h3{font:italic 600 1.45rem/1.15 var(--f-display);display:flex;gap:10px;align-items:center}
.uq p{color:var(--ink-soft)}
.uq .row{margin-top:4px}
.btn.sm{min-height:38px;padding:7px 14px;font-size:.88rem}
section{padding-block:20px 4px}
section>h2{font:italic 600 clamp(2.1rem,9vw,2.6rem)/1.05 var(--f-display);color:var(--ink);margin-bottom:18px}
section>h2::after{content:"";display:block;width:36px;height:1.5px;background:var(--accent);margin-top:12px}
h3{font:600 1.05rem/1.35 var(--f-body)}
.block{display:grid;gap:8px;padding-block:4px 20px}
.block+.block{border-top:1px solid var(--rule);padding-top:20px}
.steps{margin:0;padding-left:1.3em;display:grid;gap:6px}
.steps li::marker{font:italic 600 1.15rem var(--f-display);color:var(--accent)}
.mute{color:var(--ink-soft);font-size:.95rem}

.postits{display:grid;gap:12px}
.postit{background:var(--note);border:1px solid var(--note-line);border-radius:4px;padding:16px 18px;display:grid;gap:4px}
.postit strong{font:italic 600 1.35rem/1.2 var(--f-display);color:var(--ink)}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 0 6px}
.pair .pol img{aspect-ratio:3/4}
.pair.tall .pol img{aspect-ratio:4/5;background:#111}

.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 0 22px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.strip .pol{flex:none;width:min(66vw,240px);scroll-snap-align:start}

.ticket{background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:grid;gap:12px}
.wifi{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline;margin:0}
.wifi dt{font:600 .75rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.wifi dd{margin:0;font-weight:600;font-size:1.2rem;word-break:break-all}
.btn{font:600 .95rem var(--f-body);color:var(--paper-2);background:var(--door);border:0;border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-self:start}
.btn.ghost{background:transparent;color:var(--door);border:1.5px solid var(--door)}

.mapbar{margin:14px 0 8px;overflow-x:auto;scrollbar-width:none}
.seg{display:flex;gap:6px;flex-wrap:nowrap}
.seg button{flex:none;font:600 .82rem var(--f-body);color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;min-height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--paper-2);background:var(--ink);border-color:var(--ink)}
.map{position:relative;background:var(--map-bg);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.map svg{display:block;width:100%;height:auto;aspect-ratio:1/1}
.map .zoom{position:absolute;right:8px;bottom:8px}
.map .zoom button{box-shadow:0 2px 8px var(--shadow)}
.m-water{fill:var(--map-water)} .m-park{fill:var(--map-park)} .m-square{fill:var(--map-square)}
.m-foot{stroke:var(--map-foot);stroke-width:.7} .m-minor{stroke:var(--map-minor);stroke-width:1.5} .m-major{stroke:var(--map-major);stroke-width:2.8}
.mk{cursor:pointer} .mk circle{stroke:var(--map-bg);stroke-width:1.5}
.mk text,.home text{text-anchor:middle;font-family:var(--f-body);font-weight:700}
.mk text{fill:#fff;pointer-events:none}
.mk.on circle{stroke:var(--ink);stroke-width:2.5}
.home rect{fill:var(--ink)} .home path{stroke:var(--map-bg)} .home text{fill:var(--ink);font-style:italic;font-family:var(--f-display);font-size-adjust:none;paint-order:stroke;stroke:var(--map-bg);stroke-width:4px}
.c-sight{--c:var(--k-sight)} .c-eat{--c:var(--k-eat)} .c-ice{--c:var(--k-ice)} .c-super{--c:var(--k-super)} .c-drink{--c:var(--k-drink)} .c-uniq{--c:var(--k-uniq)} .c-bf{--c:var(--k-bf)} .c-all{--c:var(--ink)}
.mk circle{fill:var(--c)} .lead{stroke:var(--c);opacity:.8} .pin{fill:var(--c)}
.badge{flex:none;display:inline-grid;place-content:center;min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:var(--c);color:#fff;font:700 .78rem var(--f-body);font-variant-numeric:tabular-nums;align-self:center}
.seg button.c-sight[aria-pressed="true"],.seg button.c-eat[aria-pressed="true"],.seg button.c-ice[aria-pressed="true"],.seg button.c-super[aria-pressed="true"],.seg button.c-drink[aria-pressed="true"],.seg button.c-uniq[aria-pressed="true"],.seg button.c-bf[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.mapinfo{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;background:var(--paper-2);border:1px solid var(--rule);border-radius:8px}
.mapinfo[hidden]{display:none}
.mapinfo .nm{flex:1;min-width:0;font-weight:600;line-height:1.3}
.mapinfo .nm small{display:block;font-weight:400;color:var(--ink-soft);font-size:.85rem}
.small{font-size:.82rem;margin-top:8px}
.places li{cursor:pointer}
.places li.on .nm{color:var(--accent)}
.cat{font:italic 600 1.45rem/1.1 var(--f-display);color:var(--ink);margin:26px 0 6px}
.places{list-style:none;margin:0;padding:0}
.places li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.places .nm{font-weight:600;min-width:0}
.places .nm small{font:italic 500 1rem var(--f-display);color:var(--ink-soft);margin-left:6px}
.places .dots{flex:1}
.places a{flex:none;font:600 .85rem var(--f-body);text-decoration:none;color:var(--door)}

.chat{margin:28px 0 8px;padding:18px;border:1px solid var(--rule);border-radius:10px;display:grid;gap:8px;justify-items:start;background:var(--paper-2)}
.chat p{margin:0;font-size:.88rem;color:var(--ink-soft)}
.chat.inctc{margin-top:18px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.op{display:block;font:italic 400 .9rem/1.45 var(--f-body);color:var(--ink-soft);margin-top:3px;letter-spacing:0;text-transform:none}
.op.more{color:var(--k-uniq);text-decoration:none;font-style:normal;font-size:.85rem}
/* Senza script (es. anteprima file su iPhone): tutte le sezioni una sotto l'altra */
:root:not(.js) #view{display:block!important}
:root:not(.js) #view section{display:block}
:root:not(.js) .side,:root:not(.js) .back,:root:not(.js) #pn,:root:not(.js) .tiles,:root:not(.js) .quick,:root:not(.js) .langs,:root:not(.js) .mapbar,:root:not(.js) .map,:root:not(.js) .map+p,:root:not(.js) #home .chat{display:none!important}
#pw.pwno{font:italic 400 1rem var(--f-body);color:var(--ink-soft);letter-spacing:0}
.check{list-style:none;margin:0;padding:0;display:grid}
.check label{display:flex;gap:14px;align-items:flex-start;cursor:pointer;padding:9px 0;border-bottom:1px solid var(--rule)}
.check input{width:20px;height:20px;flex:none;margin:4px 0 0;accent-color:var(--door);cursor:pointer}
.check input:checked+span{color:var(--ink-soft);text-decoration:line-through}
.time{font-weight:700;color:var(--ink)}

.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.person{display:grid;gap:6px}
.person h3{font:italic 600 1.7rem/1 var(--f-display)}
.num{font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px}
.sign{padding-block:50px 60px;text-align:center;display:grid;gap:6px}
.sign .s{font:italic 500 1.9rem/1 var(--f-display);color:var(--ink)}
.sign p{color:var(--ink-soft);font-size:.92rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>

Object.assign(T.en,{"allSec": "All sections", "nUniq": "Unique Rome", "hImp": "The 4 things to know", "hArr": "Transport, doors, lift", "hNuki": "Open the doors with the app", "hWifi": "Network and password", "hHouse": "AC, boiler, appliances", "hRules": "Please respect them", "hAround": "Map, food, gelato", "hUniq": "Hidden corners and views", "hOut": "Before you leave", "hCtc": "Write to Luciana", "uniqIntro": "Places most visitors walk past: hidden courtyards, secret views and the best sunsets in Rome. Some are 5 minutes from home, others make a lovely walk.", "onMap": "On the map", "mVat": "Vatican", "u1": "A hidden Art Nouveau courtyard covered in frescoes of women, just behind Via del Corso. Free, 5 minutes from home.", "u2": "Bramante's Renaissance cloister. Upstairs, the café has a window looking straight onto Raphael's Sibyls in Santa Maria della Pace.", "u3": "The ruins where Julius Caesar was killed, today home to a cat sanctuary. You can see it from the street.", "u4": "Terrace above Piazza del Popolo: at sunset you see the whole city as far as St Peter's dome.", "u5": "The most beautiful panorama of Rome. Every day at noon a cannon shot is fired from below the terrace.", "u6": "The orange garden on the Aventine hill, with a wide view over the Tiber and St Peter's.", "u7": "Look through the keyhole of the Knights of Malta's door: St Peter's dome appears perfectly framed. There may be a short queue.", "u8": "One of Rome's largest covered markets, where Romans really shop: fruit, vegetables, cheese, cured meats and spices. A few minutes from the Vatican Museums. Open in the morning, closed on Sundays."});T.en.cats.uniq="Unique Rome";
Object.assign(T.it,{"allSec": "Tutte le sezioni", "nUniq": "Roma unica", "hImp": "Le 4 cose da sapere", "hArr": "Trasporti, portoni, ascensore", "hNuki": "Aprire le porte con l'app", "hWifi": "Rete e password", "hHouse": "Clima, caldaia, elettrodomestici", "hRules": "Per favore rispettale", "hAround": "Mappa, ristoranti, gelato", "hUniq": "Angoli nascosti e panorami", "hOut": "Prima di partire", "hCtc": "Scrivi a Luciana", "uniqIntro": "Posti davanti ai quali quasi tutti passano senza accorgersene: cortili nascosti, viste segrete e i tramonti più belli di Roma. Alcuni sono a 5 minuti da casa, altri valgono una bella passeggiata.", "onMap": "Sulla mappa", "mVat": "Vaticano", "u1": "Un cortile Liberty nascosto, tutto affrescato con figure femminili, proprio dietro Via del Corso. Gratis, a 5 minuti da casa.", "u2": "Il chiostro rinascimentale di Bramante. Al piano di sopra la caffetteria ha una finestra che guarda dritto sulle Sibille di Raffaello in Santa Maria della Pace.", "u3": "Le rovine dove fu ucciso Giulio Cesare, oggi rifugio di una colonia di gatti. Si vede dalla strada.", "u4": "La terrazza sopra Piazza del Popolo: al tramonto si vede tutta la città fino alla cupola di San Pietro.", "u5": "Il panorama più bello di Roma. Ogni giorno a mezzogiorno sotto la terrazza si spara un colpo di cannone.", "u6": "Il giardino degli aranci sull'Aventino, con una vista larghissima sul Tevere e su San Pietro.", "u7": "Guarda dal buco della serratura del portone dei Cavalieri di Malta: la cupola di San Pietro appare incorniciata alla perfezione. A volte c'è un po' di fila.", "u8": "Uno dei mercati coperti più grandi di Roma, dove fanno la spesa i romani: frutta, verdura, formaggi, salumi e spezie. A pochi minuti dai Musei Vaticani. Aperto la mattina, chiuso la domenica."});T.it.cats.uniq="Roma unica";
Object.assign(T.fr,{"allSec": "Toutes les sections", "nUniq": "Rome insolite", "hImp": "Les 4 choses à savoir", "hArr": "Transports, portes, ascenseur", "hNuki": "Ouvrir les portes avec l'appli", "hWifi": "Réseau et mot de passe", "hHouse": "Clim, chaudière, appareils", "hRules": "Merci de les respecter", "hAround": "Carte, restos, glaces", "hUniq": "Coins cachés et panoramas", "hOut": "Avant de partir", "hCtc": "Écrire à Luciana", "uniqIntro": "Des lieux devant lesquels presque tout le monde passe sans les voir : cours cachées, vues secrètes et les plus beaux couchers de soleil de Rome. Certains sont à 5 minutes de la maison, d'autres valent une belle promenade.", "onMap": "Sur la carte", "mVat": "Vatican", "u1": "Une cour Art nouveau cachée, couverte de fresques de femmes, juste derrière la Via del Corso. Gratuit, à 5 minutes de la maison.", "u2": "Le cloître Renaissance de Bramante. À l'étage, le café a une fenêtre qui donne directement sur les Sibylles de Raphaël à Santa Maria della Pace.", "u3": "Les ruines où Jules César a été assassiné, aujourd'hui refuge d'une colonie de chats. On le voit depuis la rue.", "u4": "La terrasse au-dessus de la Piazza del Popolo : au coucher du soleil, on voit toute la ville jusqu'à la coupole de Saint-Pierre.", "u5": "Le plus beau panorama de Rome. Chaque jour à midi, un coup de canon est tiré sous la terrasse.", "u6": "Le jardin des orangers sur l'Aventin, avec une vue immense sur le Tibre et Saint-Pierre.", "u7": "Regardez par le trou de la serrure de la porte des Chevaliers de Malte : la coupole de Saint-Pierre apparaît parfaitement encadrée. Il y a parfois un peu d'attente.", "u8": "L'un des plus grands marchés couverts de Rome, où les Romains font vraiment leurs courses : fruits, légumes, fromages, charcuterie et épices. À quelques minutes des Musées du Vatican. Ouvert le matin, fermé le dimanche."});T.fr.cats.uniq="Rome insolite";
Object.assign(T.es,{"allSec": "Todas las secciones", "nUniq": "Roma única", "hImp": "Las 4 cosas que debes saber", "hArr": "Transporte, puertas, ascensor", "hNuki": "Abrir las puertas con la app", "hWifi": "Red y contraseña", "hHouse": "Clima, caldera, aparatos", "hRules": "Por favor, respétalas", "hAround": "Mapa, comida, helado", "hUniq": "Rincones ocultos y vistas", "hOut": "Antes de irte", "hCtc": "Escribe a Luciana", "uniqIntro": "Lugares por delante de los que casi todos pasan sin darse cuenta: patios escondidos, vistas secretas y los atardeceres más bonitos de Roma. Algunos están a 5 minutos de casa, otros merecen un buen paseo.", "onMap": "En el mapa", "mVat": "Vaticano", "u1": "Un patio modernista escondido, cubierto de frescos de mujeres, justo detrás de Via del Corso. Gratis, a 5 minutos de casa.", "u2": "El claustro renacentista de Bramante. Arriba, la cafetería tiene una ventana que da directamente a las Sibilas de Rafael en Santa Maria della Pace.", "u3": "Las ruinas donde fue asesinado Julio César, hoy refugio de una colonia de gatos. Se ve desde la calle.", "u4": "La terraza sobre la Piazza del Popolo: al atardecer se ve toda la ciudad hasta la cúpula de San Pedro.", "u5": "El panorama más bonito de Roma. Cada día a mediodía se dispara un cañonazo bajo la terraza.", "u6": "El jardín de los naranjos en el Aventino, con una vista amplísima sobre el Tíber y San Pedro.", "u7": "Mira por el ojo de la cerradura del portón de los Caballeros de Malta: la cúpula de San Pedro aparece perfectamente enmarcada. A veces hay un poco de cola.", "u8": "Uno de los mercados cubiertos más grandes de Roma, donde compran los romanos: fruta, verdura, quesos, embutidos y especias. A pocos minutos de los Museos Vaticanos. Abierto por la mañana, cerrado los domingos."});T.es.cats.uniq="Roma única";
Object.assign(T.de,{"allSec": "Alle Abschnitte", "nUniq": "Einzigartiges Rom", "hImp": "Die 4 wichtigsten Dinge", "hArr": "Anreise, Türen, Aufzug", "hNuki": "Türen mit der App öffnen", "hWifi": "Netzwerk und Passwort", "hHouse": "Klima, Boiler, Geräte", "hRules": "Bitte beachten", "hAround": "Karte, Essen, Eis", "hUniq": "Verborgene Ecken und Ausblicke", "hOut": "Vor der Abreise", "hCtc": "Schreiben Sie Luciana", "uniqIntro": "Orte, an denen fast alle vorbeigehen, ohne sie zu bemerken: versteckte Innenhöfe, geheime Ausblicke und die schönsten Sonnenuntergänge Roms. Manche sind 5 Minuten entfernt, andere lohnen einen schönen Spaziergang.", "onMap": "Auf der Karte", "mVat": "Vatikan", "u1": "Ein versteckter Jugendstil-Innenhof voller Fresken mit Frauenfiguren, direkt hinter der Via del Corso. Kostenlos, 5 Minuten von der Wohnung.", "u2": "Bramantes Renaissance-Kreuzgang. Oben hat das Café ein Fenster mit direktem Blick auf Raffaels Sibyllen in Santa Maria della Pace.", "u3": "Die Ruinen, in denen Julius Caesar ermordet wurde, heute Zuhause einer Katzenkolonie. Man sieht sie von der Straße aus.", "u4": "Die Terrasse über der Piazza del Popolo: Bei Sonnenuntergang sieht man die ganze Stadt bis zur Kuppel des Petersdoms.", "u5": "Das schönste Panorama Roms. Jeden Tag um zwölf Uhr wird unterhalb der Terrasse ein Kanonenschuss abgefeuert.", "u6": "Der Orangengarten auf dem Aventin mit weitem Blick über den Tiber und den Petersdom.", "u7": "Schauen Sie durch das Schlüsselloch des Tors der Malteserritter: Die Kuppel des Petersdoms erscheint perfekt eingerahmt. Manchmal gibt es eine kleine Schlange.", "u8": "Eine der größten Markthallen Roms, wo die Römer wirklich einkaufen: Obst, Gemüse, Käse, Wurst und Gewürze. Wenige Minuten von den Vatikanischen Museen. Vormittags geöffnet, sonntags geschlossen."});T.de.cats.uniq="Einzigartiges Rom";

Object.assign(T.en,{"nk1": "Open the Nuki app and choose the door: “Main door Beato Angelico” is the building door on the street, “House door Beato Angelico” is the apartment door on the 1st floor.", "nk3": "Tap the yellow “Open door” button (photo 2). The door unlocks and opens. It works exactly the same way for both doors.", "arr2": "Open it with the Nuki app: choose “Main door Beato Angelico” (see the Nuki section).", "arr3": "Go up to the 1st floor: the apartment door is the dark green one. Open it the same way, choosing “House door Beato Angelico”.", "nkPh": "The photos only show how the app works: the name of the door at the top will be the one you chose."});
Object.assign(T.it,{"nk1": "Apri l’app Nuki e scegli la porta: «Main door Beato Angelico» è il portone sulla strada, «House door Beato Angelico» è la porta dell’appartamento al 1° piano.", "nk3": "Tocca il tasto giallo “Aprire porta” (foto 2). La porta si sblocca e si apre. Funziona esattamente allo stesso modo per il portone e per la porta di casa.", "arr2": "Aprilo con l’app Nuki scegliendo «Main door Beato Angelico» (vedi la sezione Nuki).", "arr3": "Sali al 1° piano: la porta di casa è quella verde scuro. Si apre allo stesso modo, scegliendo «House door Beato Angelico».", "nkPh": "Le foto mostrano solo come funziona l’app: in alto vedrai il nome della porta che hai scelto."});
Object.assign(T.fr,{"nk1": "Ouvrez l’application Nuki et choisissez la porte : « Main door Beato Angelico » est la porte de l’immeuble sur la rue, « House door Beato Angelico » est la porte de l’appartement au 1er étage.", "nk3": "Appuyez sur le bouton jaune « Ouvrir la porte » (photo 2). La porte se déverrouille et s’ouvre. Cela fonctionne exactement de la même façon pour les deux portes.", "arr2": "Ouvrez-la avec l’application Nuki en choisissant « Main door Beato Angelico » (voir la section Nuki).", "arr3": "Montez au 1er étage : la porte de l’appartement est vert foncé. Elle s’ouvre de la même façon, en choisissant « House door Beato Angelico ».", "nkPh": "Les photos montrent seulement le fonctionnement de l’application : en haut, vous verrez le nom de la porte choisie."});
Object.assign(T.es,{"nk1": "Abre la app Nuki y elige la puerta: «Main door Beato Angelico» es el portal de la calle, «House door Beato Angelico» es la puerta del apartamento en la 1.ª planta.", "nk3": "Pulsa el botón amarillo «Abrir puerta» (foto 2). La puerta se desbloquea y se abre. Funciona exactamente igual para el portal y para la puerta de casa.", "arr2": "Ábrelo con la app Nuki eligiendo «Main door Beato Angelico» (ver la sección Nuki).", "arr3": "Sube a la 1.ª planta: la puerta del apartamento es la verde oscuro. Se abre de la misma forma, eligiendo «House door Beato Angelico».", "nkPh": "Las fotos solo muestran cómo funciona la app: arriba verás el nombre de la puerta que hayas elegido."});
Object.assign(T.de,{"nk1": "Öffnen Sie die Nuki-App und wählen Sie die Tür: „Main door Beato Angelico“ ist die Haustür an der Straße, „House door Beato Angelico“ die Wohnungstür im 1. Stock.", "nk3": "Tippen Sie auf den gelben Knopf „Tür öffnen“ (Foto 2). Die Tür wird entriegelt und öffnet sich. Das funktioniert bei beiden Türen genau gleich.", "arr2": "Öffnen Sie sie mit der Nuki-App, indem Sie „Main door Beato Angelico“ wählen (siehe Abschnitt Nuki).", "arr3": "Gehen Sie in den 1. Stock: Die Wohnungstür ist dunkelgrün. Sie öffnet sich genauso, wenn Sie „House door Beato Angelico“ wählen.", "nkPh": "Die Fotos zeigen nur, wie die App funktioniert: Oben steht der Name der Tür, die Sie gewählt haben."});

Object.assign(T.en,{keysT:"Physical keys too",keys:"You will find a set of physical keys on the desk in the living room. Please always take them with you when you go out, in addition to the Nuki app: if your phone runs out of battery or loses connection, you can still get in."});
Object.assign(T.it,{keysT:"Anche le chiavi",keys:"Troverete un mazzo di chiavi fisiche sulla scrivania nel salone. Portatele sempre con voi quando uscite, oltre al Nuki: se il telefono si scarica o non ha connessione, potete entrare lo stesso."});
Object.assign(T.fr,{keysT:"Les clés aussi",keys:"Vous trouverez un jeu de clés physiques sur le bureau du salon. Emportez-les toujours avec vous quand vous sortez, en plus de l'application Nuki : si votre téléphone n'a plus de batterie ou de connexion, vous pourrez quand même entrer."});
Object.assign(T.es,{keysT:"También las llaves",keys:"Encontraréis un juego de llaves físicas en el escritorio del salón. Llevadlas siempre con vosotros cuando salgáis, además de la app Nuki: si el móvil se queda sin batería o sin conexión, podréis entrar igualmente."});
Object.assign(T.de,{keysT:"Auch die Schlüssel",keys:"Einen Satz physischer Schlüssel finden Sie auf dem Schreibtisch im Wohnzimmer. Nehmen Sie ihn beim Hinausgehen bitte immer mit, zusätzlich zur Nuki-App: Wenn der Akku leer ist oder keine Verbindung besteht, kommen Sie trotzdem hinein."});

T.it.op={"Pantheon": "Entrate e guardate in su: l'occhio della cupola è aperto sul cielo da quasi 2000 anni.", "Santa Maria sopra Minerva": "Da fuori sembra semplice, dentro c'è un cielo blu stellato: l'unica chiesa gotica di Roma.", "Sant'Ignazio di Loyola": "Mettetevi sul disco nel pavimento e guardate la finta cupola: un'illusione che lascia a bocca aperta.", "Galleria Doria Pamphilj": "Un palazzo ancora abitato dalla famiglia, con Caravaggio e Velázquez quasi solo per voi.", "Fontana di Trevi": "Andateci presto la mattina o tardi la sera: senza folla è un'altra cosa. E lanciate la monetina!", "Piazza Navona": "La piazza più bella per una passeggiata, soprattutto al tramonto con gli artisti di strada.", "Altare della Patria": "Salite in ascensore fino in cima: la vista su tutta Roma vale il biglietto.", "Campo de' Fiori": "La mattina c'è il mercato, la sera diventa la piazza più vivace del centro.", "Castel Sant'Angelo": "Arrivateci dal Ponte degli Angeli e salite sulla terrazza: San Pietro sembra a un passo.", "Basilica di San Pietro": "Salite sulla cupola, anche a piedi: la vista sulla piazza e su Roma è indimenticabile.", "Musei Vaticani": "Prenotate online e andate di prima mattina: la Cappella Sistina vi resterà nel cuore.", "Carrefour Express": "Il più comodo per la spesa veloce, a due passi da casa.", "Caffè Gotico": "Un bar piccolo e accogliente dietro il Pantheon, perfetto per cornetto e cappuccino.", "Casa Maddalena": "Per una colazione con calma a due passi dal Pantheon.", "Pasticceria La Deliziosa": "Dolci fatti come una volta: provate i maritozzi con la panna.", "Celiachiamo LAB Prati": "Forno tutto senza glutine: cornetti e dolci che non sembrano senza glutine.", "Le Altre Farine del Mulino": "Senza glutine a due passi da San Pietro, buono per colazione e non solo.", "Ginger": "Quando avete voglia di qualcosa di fresco e leggero: insalate, centrifughe e bowl.", "Osteria da Fortunata": "Guardate le signore che tirano la pasta a mano in vetrina, poi assaggiatela.", "Trapizzino": "Lo street food romano più furbo: pizza bianca ripiena di sugo alla romana.", "Ditirambo": "Cucina romana fatta con cura, in una saletta intima vicino a Campo de' Fiori.", "Pandalì": "Tutto senza glutine, ma lo amano anche i non celiaci.", "Gluten Free San Pietro": "Carbonara, lasagne e tiramisù tutti senza glutine: non sentirete la differenza.", "Buddy Veggy": "Vegano e goloso, comodo in pieno centro.", "Écru": "Piccolo e curato, con piatti vegani crudi e biologici.", "Flower Burger": "Hamburger vegani coloratissimi, divertenti anche per chi vegano non è.", "Eroi della Pizza": "Pizza buonissima dopo una giornata ai Musei Vaticani, e provate anche i supplì!", "Trattoria da Alfredo e Ada": "Piccola trattoria di una volta, si mangia quello che c'è quel giorno.", "Alfredo alla Scrofa": "Qui sono nate le fettuccine Alfredo: provatele dove tutto è cominciato.", "Sora Lella": "Sull'Isola Tiberina, la cucina romana di una famiglia storica.", "Taverna 51": "Atmosfera da vera osteria di Trastevere, porzioni generose.", "Tonnarello": "La cacio e pepe servita nella padella: c'è spesso fila, ma scorre veloce.", "Nannarella": "Trattoria allegra in una piazzetta di Trastevere, cucina romana senza fronzoli.", "Osteria Martino": "Piccola osteria nei vicoli di Trastevere, accoglienza calorosa.", "La Forchetta Romana": "Ai piedi del Gianicolo: perfetta per cena dopo il tramonto lassù.", "Osteria Sant'Uffizio": "Una vera osteria romana a due passi da San Pietro, dove i turisti di solito non arrivano.", "Pastasciutta": "Pasta fresca veloce e buonissima: perfetta per pranzo vicino al Vaticano.", "200 Gradi": "Panini enormi e farciti bene, ideali prima o dopo i Musei.", "Venchi": "Per gli amanti del cioccolato: il gelato al fondente è da provare.", "La Romana": "Gelato cremoso e un rubinetto di cioccolato fuso nel cono: irresistibile.", "Cremilla": "Gelato artigianale buonissimo sulla strada tra Castel Sant'Angelo e San Pietro.", "Neve di Latte": "Gelato con ingredienti scelti e pochi gusti, tutti fatti bene.", "Giolitti": "Una delle gelaterie storiche di Roma, dal 1900: un classico.", "Otaleg": "Gusti originali e sorprendenti: il gelato da provare a Trastevere.", "Oro Bistrot (NH Hotel)": "Un aperitivo in terrazza con vista sull'Altare della Patria e i tetti di Roma.", "Terrazza Borromini": "Un drink al tramonto sopra Piazza Navona, con la cupola di Sant'Agnese davanti.", "Terrazza Les Étoiles": "La cupola di San Pietro così vicina sembra di poterla toccare."};
T.en.op={"Pantheon": "Step inside and look up: the dome's oculus has been open to the sky for almost 2,000 years.", "Santa Maria sopra Minerva": "Plain outside, a starry blue ceiling inside: Rome's only Gothic church.", "Sant'Ignazio di Loyola": "Stand on the disc in the floor and look at the fake dome: an illusion that leaves you speechless.", "Galleria Doria Pamphilj": "A palace still lived in by the family, with Caravaggio and Velázquez almost all to yourself.", "Fontana di Trevi": "Go early in the morning or late at night: without the crowds it's another world. And toss a coin!", "Piazza Navona": "The loveliest square for a stroll, especially at sunset with the street artists.", "Altare della Patria": "Take the lift to the top: the view over the whole city is worth the ticket.", "Campo de' Fiori": "A market in the morning, the liveliest square in the centre at night.", "Castel Sant'Angelo": "Walk over the Bridge of Angels and climb to the terrace: St Peter's feels within reach.", "Basilica di San Pietro": "Climb the dome, even on foot: the view of the square and the city is unforgettable.", "Musei Vaticani": "Book online and go first thing in the morning: the Sistine Chapel will stay with you.", "Carrefour Express": "The handiest for quick shopping, a stone's throw from home.", "Caffè Gotico": "A small, cosy café behind the Pantheon, perfect for a cornetto and cappuccino.", "Casa Maddalena": "For an unhurried breakfast a few steps from the Pantheon.", "Pasticceria La Deliziosa": "Old-school pastries: try the maritozzi with cream.", "Celiachiamo LAB Prati": "An entirely gluten-free bakery: pastries you'd never guess are gluten-free.", "Le Altre Farine del Mulino": "Gluten-free a few steps from St Peter's, good for breakfast and more.", "Ginger": "When you fancy something fresh and light: salads, juices and bowls.", "Osteria da Fortunata": "Watch the ladies rolling pasta by hand in the window, then taste it.", "Trapizzino": "Rome's cleverest street food: pizza pockets filled with Roman stews.", "Ditirambo": "Roman cooking made with care, in an intimate little room near Campo de' Fiori.", "Pandalì": "Everything gluten-free, but loved by everyone.", "Gluten Free San Pietro": "Carbonara, lasagne and tiramisù, all gluten-free: you won't taste the difference.", "Buddy Veggy": "Vegan and indulgent, handy right in the centre.", "Écru": "Small and lovingly kept, with raw organic vegan dishes.", "Flower Burger": "Brightly coloured vegan burgers, fun even if you're not vegan.", "Eroi della Pizza": "Delicious pizza after a day at the Vatican Museums, and don't miss the supplì (fried rice balls)!", "Trattoria da Alfredo e Ada": "A tiny old-fashioned trattoria: you eat whatever is cooking that day.", "Alfredo alla Scrofa": "Fettuccine Alfredo was born here: try it where it all began.", "Sora Lella": "On Tiber Island, Roman cooking from a historic family.", "Taverna 51": "A true Trastevere osteria atmosphere, with generous portions.", "Tonnarello": "Cacio e pepe served in the pan: there's often a queue, but it moves fast.", "Nannarella": "A cheerful trattoria on a little Trastevere square, honest Roman food.", "Osteria Martino": "A small osteria in Trastevere's lanes, with a warm welcome.", "La Forchetta Romana": "At the foot of the Gianicolo: perfect for dinner after sunset up there.", "Osteria Sant'Uffizio": "A real Roman osteria steps from St Peter's, where tourists rarely end up.", "Pastasciutta": "Quick, delicious fresh pasta: perfect for lunch near the Vatican.", "200 Gradi": "Huge, generously filled sandwiches, ideal before or after the Museums.", "Venchi": "For chocolate lovers: the dark chocolate gelato is a must.", "La Romana": "Creamy gelato and melted chocolate poured into the cone: irresistible.", "Cremilla": "Delicious artisan gelato on the way between Castel Sant'Angelo and St Peter's.", "Neve di Latte": "Gelato with carefully chosen ingredients and a few flavours, all done well.", "Giolitti": "One of Rome's historic gelaterias, open since 1900: a classic.", "Otaleg": "Original, surprising flavours: the gelato to try in Trastevere.", "Oro Bistrot (NH Hotel)": "Aperitivo on a terrace overlooking the Altare della Patria and Rome's rooftops.", "Terrazza Borromini": "A sunset drink above Piazza Navona, with the dome of Sant'Agnese right in front.", "Terrazza Les Étoiles": "St Peter's dome so close you feel you could touch it."};
T.fr.op={"Pantheon": "Entrez et levez les yeux : l'oculus de la coupole est ouvert sur le ciel depuis presque 2000 ans.", "Santa Maria sopra Minerva": "Sobre dehors, un plafond bleu étoilé dedans : la seule église gothique de Rome.", "Sant'Ignazio di Loyola": "Placez-vous sur le disque au sol et regardez la fausse coupole : une illusion bluffante.", "Galleria Doria Pamphilj": "Un palais encore habité par la famille, avec Caravage et Velázquez presque rien que pour vous.", "Fontana di Trevi": "Allez-y tôt le matin ou tard le soir : sans la foule, c'est autre chose. Et lancez la pièce !", "Piazza Navona": "La plus belle place pour flâner, surtout au coucher du soleil avec les artistes de rue.", "Altare della Patria": "Montez en ascenseur jusqu'en haut : la vue sur tout Rome vaut le billet.", "Campo de' Fiori": "Le marché le matin, la place la plus animée du centre le soir.", "Castel Sant'Angelo": "Arrivez par le pont des Anges et montez sur la terrasse : Saint-Pierre semble à deux pas.", "Basilica di San Pietro": "Montez sur la coupole, même à pied : la vue sur la place et sur Rome est inoubliable.", "Musei Vaticani": "Réservez en ligne et allez-y tôt le matin : la chapelle Sixtine vous restera au cœur.", "Carrefour Express": "Le plus pratique pour les courses rapides, à deux pas de la maison.", "Caffè Gotico": "Un petit café chaleureux derrière le Panthéon, parfait pour un cornetto et un cappuccino.", "Casa Maddalena": "Pour un petit-déjeuner sans se presser à deux pas du Panthéon.", "Pasticceria La Deliziosa": "Des pâtisseries à l'ancienne : goûtez les maritozzi à la crème.", "Celiachiamo LAB Prati": "Boulangerie entièrement sans gluten : des viennoiseries qu'on ne devinerait jamais sans gluten.", "Le Altre Farine del Mulino": "Sans gluten à deux pas de Saint-Pierre, pour le petit-déjeuner et plus encore.", "Ginger": "Quand vous avez envie de frais et léger : salades, jus et bowls.", "Osteria da Fortunata": "Regardez les dames étaler les pâtes à la main en vitrine, // Password del Wi-Fi: qui c'e' solo la versione cifrata (AES-GCM).
// La chiave arriva nel link mandato agli ospiti: ...?k=CHIAVE
// Per cambiare password usa cripta-wifi.html (resta sul computer, non va su GitHub).
const WIFI_ENC="XtF8XTgXzhzY4ZFgNZK1K6tglRBIwH7zdzhdIugh5n0l560-vA";
let WIFI_PW="";
const b64u=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function unlockWifi(){
  try{
    const k=new URLSearchParams(location.search).get("k"); if(!k) return;
    const raw=b64u(WIFI_ENC), key=await crypto.subtle.importKey("raw",b64u(k),"AES-GCM",false,["decrypt"]);
    WIFI_PW=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12)));
  }catch(e){WIFI_PW=""}
  showPw();
}
function showPw(){
  const d=document.getElementById("pw"); if(!d) return;
  d.textContent=WIFI_PW||T[lang].pwNo; d.classList.toggle("pwno",!WIFI_PW);
  document.getElementById("copy").hidden=!WIFI_PW;
}

// Mappa: stessa proiezione usata per disegnare mappa-vie.svg
const HOMEPOS=[41.89809,12.47930];
const LAT1=41.9140,LON0=12.4500,CS=Math.cos(41.897*Math.PI/180),KM=1000/((12.4900-LON0)*CS);
const mx=lon=>(lon-LON0)*CS*KM, my=lat=>(LAT1-lat)*KM;
const VIEWS={near:[mx(HOMEPOS[1])-250,my(HOMEPOS[0])-250,500,500],vat:[0,110,560,560],wide:[0,40,1000,1000]};
let view="near",filter="all",sel=-1,lang="en";
P.forEach((p,i)=>{p.n=null});
let n=0; P.forEach(p=>{if(p[3]) p.n=++n});
function route(q){return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(HOME)+"&destination="+encodeURIComponent(q)+"&travelmode=walking"}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function loadStreets(){
  // le vie stanno in mappa-vie.js (funziona anche aprendo il file dal computer)
  const t=window.MAPPA_SVG||""; const m=t.match(/<svg[^>]*>([\s\S]*)<\/svg>/);
  if(m) document.getElementById("streets").innerHTML=m[1];
}
function drawMarkers(){
  const pts=[]; P.forEach((p,i)=>{ if(p.n&&(filter==="all"||p[1]===filter)) pts.push({i,p,x0:mx(p[4]),y0:my(p[3])}) });
  let v=VIEWS[view];
  if(view==="wide"){ // inquadra tutti i punti visibili (e la casa)
    const xs=pts.map(q=>q.x0).concat(mx(HOMEPOS[1])), ys=pts.map(q=>q.y0).concat(my(HOMEPOS[0]));
    const x1=Math.min(...xs),x2=Math.max(...xs),y1=Math.min(...ys),y2=Math.max(...ys)+(Math.max(...ys)-Math.min(...ys))*.12; // spazio per i pulsanti in basso
    const side=Math.max(x2-x1,y2-y1,300)*1.12;
    const cl=(c,max)=>side>=max?(max-side)/2:Math.min(Math.max(c-side/2,0),max-side); // resta dentro la mappa disegnata
    v=[cl((x1+x2)/2,1000),cl((y1+y2)/2,1075),side,side];
  }
  const r=v[2]/(view==="wide"?50:40), fs=r*1.15;
  document.getElementById("mapsvg").setAttribute("viewBox",v.map(n=>n.toFixed(1)).join(" "));
  // allontana i segni che si sovrappongono; una linea sottile porta al punto vero
  pts.forEach(q=>{q.x=q.x0;q.y=q.y0});
  const hx0=mx(HOMEPOS[1]),hy0=my(HOMEPOS[0]),D=r*2.15;
  for(let it=0;it<80;it++){
    let moved=false;
    for(let a=0;a<pts.length;a++){
      const A=pts[a];
      for(let b=a+1;b<pts.length;b++){
        const B=pts[b]; let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);
        if(d<D){ if(d<.01){dx=Math.cos(a+b);dy=Math.sin(a+b);d=1} const k=(D-d)/2/d; A.x-=dx*k;A.y-=dy*k;B.x+=dx*k;B.y+=dy*k; moved=true }
      }
      let dx=A.x-hx0,dy=A.y-(hy0+r*.8),d=Math.hypot(dx,dy),H=r*3.1; // lascia libera la casa
      if(d<H){ if(d<.01){dx=0;dy=-1;d=1} const k=(H-d)/d; A.x+=dx*k;A.y+=dy*k; moved=true }
    }
    if(!moved) break;
  }
  let lines="",g="";
  pts.forEach(({i,p,x0,y0,x,y})=>{
    const on=i===sel;
    if(Math.hypot(x-x0,y-y0)>r*.4) lines+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="lead c-${p[1]}" stroke-width="${(r*.12).toFixed(2)}"/><circle cx="${x0.toFixed(1)}" cy="${y0.toFixed(1)}" r="${(r*.22).toFixed(1)}" class="pin c-${p[1]}"/>`;
    g+=`<g class="mk c-${p[1]}${on?" on":""}" data-i="${i}" tabindex="0" role="button" aria-label="${esc(p[0])}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(on?r*1.3:r).toFixed(1)}"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" dy=".36em" font-size="${(on?fs*1.2:fs).toFixed(1)}">${p.n}</text></g>`;
  });
  // il segno selezionato va sopra gli altri
  g=lines+g.replace(/(<g class="mk[^"]* on"[\s\S]*?<\/g>)([\s\S]*)$/,"$2$1");
  const hx=mx(HOMEPOS[1]),hy=my(HOMEPOS[0]),s=r*1.25;
  g+=`<g class="home"><rect x="${(hx-s).toFixed(1)}" y="${(hy-s).toFixed(1)}" width="${(2*s).toFixed(1)}" height="${(2*s).toFixed(1)}" rx="${(s*.35).toFixed(1)}"/><path d="M${hx-s*.55} ${hy+s*.05} L${hx} ${hy-s*.5} L${hx+s*.55} ${hy+s*.05} M${hx-s*.35} ${hy-.1*s} V${hy+s*.5} H${hx+s*.35} V${hy-.1*s}" fill="none" stroke-width="${(r*.16).toFixed(2)}" stroke-linejoin="round"/><text x="${hx}" y="${(hy+s*2.1).toFixed(1)}" font-size="${(fs*1.05).toFixed(1)}">${esc(T[lang].home)}</text></g>`;
  document.getElementById("marks").innerHTML=g;
}
function showInfo(){
  const box=document.getElementById("mapinfo"),t=T[lang];
  if(sel<0){box.hidden=true;return}
  const p=P[sel]; box.hidden=false;
  box.innerHTML=`<span class="badge c-${p[1]}">${p.n||"·"}</span><span class="nm">${esc(p[0])}<small>${t.cats[p[1]]}${p[5]?" · "+(p[5]==2?t.vg:t.gf):""}</small>${t.op[p[0]]?`<em class="op">${t.op[p[0]]}</em>`:""}</span><a class="btn" href="${route(p[2])}" target="_blank" rel="noopener">${t.route} →</a>`;
}
function select(i){sel=i;drawMarkers();showInfo();
  document.querySelectorAll("#placelist li").forEach(li=>li.classList.toggle("on",+li.dataset.i===i));}
function renderPlaces(){
  const t=T[lang];

  document.getElementById("mapzoom").innerHTML=["near","vat","wide"].map(v=>`<button type="button" data-v="${v}" aria-pressed="${view===v}">${{near:t.mNear,vat:t.mVat,wide:t.mWide}[v]}</button>`).join("");
  let h="";
  ["sight","uniq","bf","eat","ice","super","drink"].forEach(c=>{
    if(filter!=="all"&&filter!==c) return;
    h+=`<h3 class="cat">${t.cats[c]}</h3>${c==="uniq"?`<a class="op more" href="#unique">${t.more} →</a>`:""}<ul class="places">`;
    P.forEach((p,i)=>{ if(p[1]!==c) return; h+=`<li data-i="${i}" class="${i===sel?"on":""}"><span class="badge c-${c}">${p.n||"·"}</span><span class="nm">${esc(p[0])}${p[5]?`<small>${p[5]==2?t.vg:t.gf}</small>`:""}${t.op[p[0]]?`<em class="op">${t.op[p[0]]}</em>`:""}</span><span class="dots"></span><a href="${route(p[2])}" target="_blank" rel="noopener">${t.route} →</a></li>`});
    h+="</ul>";
  });
  document.getElementById("placelist").innerHTML=h;
  document.getElementById("uniqlist").innerHTML=P.map((p,i)=>p[1]!=="uniq"?"":`<article><h3><span class="badge c-uniq">${p.n}</span>${esc(p[0])}</h3><p>${t[p[6]]||""}</p><div class="row"><a class="btn sm" href="${route(p[2])}" target="_blank" rel="noopener">${t.route} →</a><a class="btn ghost sm" href="#around" data-show="${i}">${t.onMap}</a></div></article>`).join("");
  drawMarkers(); showInfo();
}
function render(l){
  const t=T[l];
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(e=>{const v=t[e.dataset.i]; if(v!=null) e.innerHTML=v});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  lang=l; renderPlaces();
  document.getElementById("rulelist").innerHTML=t.rules.map(r=>`<li>${r}</li>`).join("");
  let saved={}; try{saved=JSON.parse(localStorage.getItem("co")||"{}")}catch(e){}
  document.getElementById("checklist").innerHTML=t.co.map((c,i)=>`<li><label><input type="checkbox" id="co${i}" ${saved[i]?"checked":""}><span>${c}</span></label></li>`).join("");
  try{localStorage.setItem("lang",l)}catch(e){}
  showPw();
  if(typeof route_==="function"&&!document.getElementById("view").hidden) route_();
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.l)));
document.getElementById("checklist").addEventListener("change",e=>{
  const s={}; document.querySelectorAll("#checklist input").forEach((c,i)=>{if(c.checked)s[i]=1});
  try{localStorage.setItem("co",JSON.stringify(s))}catch(e){}
  const all=[...document.querySelectorAll("#checklist input")];
  if(e.target.checked&&all.every(c=>c.checked)) confetti();
});
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.createElement("canvas"); c.id="confetti"; document.body.appendChild(c);
  const x=c.getContext("2d"),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio,d=devicePixelRatio;
  c.style.width=innerWidth+"px"; c.style.height=innerHeight+"px";
  const col=["#9a5b2e","#1f4d3a","#b0476e","#8a6d1f","#6a4c93","#2e7d8c","#e0a575"];
  const ps=Array.from({length:160},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14*d,vy:(-Math.random()*14-6)*d,w:(6+Math.random()*6)*d,h:(3+Math.random()*4)*d,a:Math.random()*6,va:(Math.random()-.5)*.3,c:col[Math.floor(Math.random()*col.length)]}));
  let t=0;(function f(){
    x.clearRect(0,0,W,H); t++;
    ps.forEach(p=>{p.vy+=.35*d;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(t<200) requestAnimationFrame(f); else c.remove();
  })();
}
document.getElementById("copy").addEventListener("click",async e=>{
  const b=e.currentTarget,l=document.documentElement.lang;
  if(!WIFI_PW)return;
  try{await navigator.clipboard.writeText(WIFI_PW);b.textContent=T[l].copied}
  catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("pw"));const s=getSelection();s.removeAllRanges();s.addRange(r)}
});
// Sezioni: la home mostra le schede, ogni sezione si apre da sola (indirizzo #nome)
const ORDER=[...document.querySelectorAll("#view section")].map(x=>x.id.slice(4));
function label(id){const a=document.querySelector(`.side a[data-s="${id}"]`);return a?a.textContent:id}
function route_(){
  const id=location.hash.slice(1), ok=ORDER.includes(id);
  document.getElementById("home").hidden=ok; document.getElementById("view").hidden=!ok;
  if(!ok) return;
  document.querySelectorAll("#view section").forEach(x=>x.classList.toggle("on",x.id==="sec-"+id));
  document.querySelectorAll(".side a[data-s]").forEach(a=>a.classList.toggle("on",a.dataset.s===id));
  const k=ORDER.indexOf(id),pv=ORDER[k-1],nx=ORDER[k+1],t=T[lang];
  document.getElementById("pn").innerHTML=(pv?`<a href="#${pv}">← ${t.prev}<b>${label(pv)}</b></a>`:"")+(nx?`<a class="nx" href="#${nx}">${t.next} →<b>${label(nx)}</b></a>`:"");
}
window.addEventListener("hashchange",()=>{route_();window.scrollTo(0,0)});
document.getElementById("uniqlist").addEventListener("click",e=>{const a=e.target.closest("[data-show]");if(!a)return;const i=+a.dataset.show;filter="all";view="wide";sel=i;setTimeout(()=>{renderPlaces();select(i)},0)});
let start="en";
try{const s=localStorage.getItem("lang"); if(s&&T[s]) start=s; else {const n=(navigator.language||"en").slice(0,2); if(T[n]) start=n}}catch(e){}
loadStreets(); render(start); route_(); unlockWifi();
document.getElementById("mapfilters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.c;if(sel>=0&&filter!=="all"&&P[sel][1]!==filter)sel=-1;renderPlaces()});
document.getElementById("mapzoom").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;renderPlaces()});
document.getElementById("marks").addEventListener("click",e=>{const g=e.target.closest(".mk");if(g)select(+g.dataset.i)});
document.getElementById("marks").addEventListener("keydown",e=>{const g=e.target.closest(".mk");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();select(+g.dataset.i)}});
document.getElementById("placelist").addEventListener("click",e=>{if(e.target.closest("a"))return;const li=e.target.closest("li");if(!li)return;const i=+li.dataset.i;if(!P[i].n)return;if(view==="near"){const v=VIEWS.near,x=mx(P[i][4]),y=my(P[i][3]);if(x<v[0]||x>v[0]+v[2]||y<v[1]||y>v[1]+v[3])view="wide"}renderPlaces();select(i);document.querySelector(".map").scrollIntoView({behavior:"smooth",block:"center"})});
</script>
